name: Classroom language checks
on:
  pull_request:
    paths:
      - index.html
      - tests/languages.mjs
      - .github/workflows/languages.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Dutch and English classroom tools
        run: node tests/languages.mjs
